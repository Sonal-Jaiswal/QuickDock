# XcodeGen spec for QuickDock.xcodeproj.
#   brew install xcodegen && xcodegen generate
# The Swift package (Package.swift) is the source of truth for the core library and tests;
# this project adds a native macOS app target for working in Xcode.
name: QuickDock
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  QuickDockPackage:
    path: .
settings:
  base:
    MARKETING_VERSION: "0.9.0"        # keep in sync with VERSION
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64                      # Apple Silicon first; set to "arm64 x86_64" for universal
targets:
  QuickDock:
    type: application
    platform: macOS
    sources:
      - path: Sources/QuickDock
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: QuickDockPackage
        product: QuickDockCore
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: QuickDock
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sonal-jaiswal.QuickDock   # keep in sync with config/release.env
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/QuickDock.entitlements
        CODE_SIGN_IDENTITY: "-"           # "Sign to Run Locally"; use Developer ID for distribution
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        QD_COPYRIGHT: "© 2026 The QuickDock Authors. MIT License."
        QD_REPOSITORY_URL: "https://github.com/Sonal-Jaiswal/QuickDock"
        QD_WEBSITE_URL: "https://sonal-jaiswal.github.io/QuickDock"
        QD_SUPPORT_EMAIL: "its.sonaljaiswal@gmail.com"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
