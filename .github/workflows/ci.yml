name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: scripts/test.sh

      - name: Release build
        run: scripts/build-app.sh

      - name: Package DMG
        run: scripts/make-dmg.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: QuickDock-ci-${{ github.sha }}
          path: dist/*
          retention-days: 14
